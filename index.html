<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Browser-tab icon. Its own file (IMG.brand.favicon) so swapping it
         never touches the header, mobile or footer logo. -->
    <link rel="icon" type="image/png" href="/images/brand/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Healthy Home — weight loss & obesity management, aesthetic & skin treatments, wellness programs, health screening and wellness products. Free consultations." />
    <title>Healthy Home | Weight Loss, Wellness & Skin</title>

    <!-- Body typeface: Montserrat, from Google Fonts. Loaded from the document
         rather than via @import in index.css on purpose — a CSS @import cannot
         begin until the main stylesheet has downloaded and parsed, so it delays
         the font request behind the whole CSS bundle. These two preconnects warm
         the TLS handshake so the font request costs roughly one round trip. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
    />

    <!-- Botpress chat widget ("Healthy Home AI Guide").

         `defer` on the loader is the one change to the snippet Botpress ships,
         and it is deliberate. As given, this is a classic script in <head>, and
         a classic script there is render-blocking: the browser must download and
         run it before it parses anything else. inject.js is ~1.7 MB
         uncompressed, so that is the entire first paint held behind a chat
         bubble.

         `defer` removes the blocking without changing what runs when. Deferred
         scripts still execute in document order, so inject.js still defines
         window.botpress before the config below calls window.botpress.init(),
         and document.currentScript — which inject.js reads to locate its own
         script tag — is still populated for deferred execution. The widget
         still appears on first paint; it just no longer gates it.

         Keep the order of these two tags. Swapping them breaks init(). -->
    <script src="https://cdn.botpress.cloud/webchat/v5.0/inject.js" defer></script>
    <script
      src="https://files.bpcontent.cloud/2026/10/08/09/20261008091535-FT87IBCI.js"
      defer
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

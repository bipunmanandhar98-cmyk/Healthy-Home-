<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Browser-tab icon. Its own file (IMG.brand.favicon) so swapping it
         never touches the header, mobile or footer logo. -->
    <link rel="icon" type="image/png" href="/images/brand/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Healthy Home — weight loss & obesity management, aesthetic & skin treatments, wellness programs, health screening and wellness products. Free consultations." />
    <title>Healthy Home | Weight Loss, Wellness & Skin</title>

    <!-- Body typeface: Montserrat, from Google Fonts. Loaded from the document
         rather than via @import in index.css on purpose — a CSS @import cannot
         begin until the main stylesheet has downloaded and parsed, so it delays
         the font request behind the whole CSS bundle. These two preconnects warm
         the TLS handshake so the font request costs roughly one round trip. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
    />

    <!-- Botpress chat widget ("Healthy Home AI Guide").

     Byte-for-byte the snippet from the Botpress dashboard, deliberately
     unaltered. An earlier commit added defer to the loader; that has been
     reverted so this file matches the vendor install instructions exactly.

     Reverting costs something real, so it is recorded here rather than just
     dropped. Without defer this is a classic script in <head>, which is
     render-blocking: the browser fetches and runs inject.js before parsing
     anything else, and inject.js is ~1.7 MB uncompressed, so first paint
     waits on the chat loader. defer avoided that without changing execution
     order (deferred scripts still run in document order, so window.botpress
     is still defined before the config calls init(), and
     document.currentScript is still populated), and the init handshake was
     verified working with it in place.

     It was not the cause of the launcher bubble failing to appear, though.
     That was traced to document.visibilityState being "hidden", which stops
     Botpress mounting at all. defer bought no observable benefit, so
     matching the vendor snippet is worth more than the theoretical saving.

     Keep the order of these two tags. Swapping them breaks init(). -->
    <script src="https://cdn.botpress.cloud/webchat/v5.0/inject.js"></script>
    <script
      src="https://files.bpcontent.cloud/2026/10/08/09/20261008091535-FT87IBCI.js"
      defer
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
